<router-outlet></router-outlet>
<!-- Floating Contact Button -->
<app-floating-contact-button (openForm)="openContactForm()"></app-floating-contact-button>

<!-- Contact Form Modal -->
<app-contact-form 
  *ngIf="showContactForm"
  [isOpen]="showContactForm"
  [preselectedProductId]="preselectedProductId"
  (close)="closeContactForm()"
  (submit)="handleFormSubmit($event)"
></app-contact-form>


<div *ngIf="showConsentPopup" class="cookie-consent" role="dialog" aria-live="polite" aria-label="Cookie consent popup">
  <div class="cookie-consent__panel">
    <div class="cookie-consent__text">
      <h2>We value your privacy</h2>
      <p>
        We use cookies to remember your choices, improve your experience, and understand how visitors engage with our website.
      </p>
    </div>

    <div class="cookie-consent__actions">
      <button type="button" class="cookie-button cookie-button--secondary" data-testid="reject-cookie-consent" (click)="rejectCookies()">
        Reject
      </button>
      <button type="button" class="cookie-button cookie-button--primary" data-testid="accept-cookie-consent" (click)="acceptCookies()">
        Accept
      </button>
    </div>
  </div>
</div>
