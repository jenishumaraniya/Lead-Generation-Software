<div class="category-list">
  <div class="header">
    <h2>Categories</h2>
    <button (click)="openAddModal()" class="btn-primary">+ Add Category</button>
  </div>

  <div class="table-container" *ngIf="!loading; else loadingTemplate">
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Category Name</th>
          <th>Created At</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories">
          <td>{{ cat.categoryId }}</td>
          <td>{{ cat.categoryName }}</td>
          <td>{{ cat.createdAt | date:'medium' }}</td>
          <td>
            <button (click)="openEditModal(cat)" class="edit-btn">Edit</button>
            <button (click)="deleteCategory(cat.categoryId)" class="delete-btn">Delete</button>
          </td>
        </tr>
        <tr *ngIf="!categories.length">
          <td colspan="4" class="empty">No categories found.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <ng-template #loadingTemplate>
    <div class="loading">Loading...</div>
  </ng-template>

  <!-- Modal -->
  <div class="modal" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <h3>{{ isEdit ? 'Edit Category' : 'Add Category' }}</h3>
      <div class="form-group">
        <label>Category Name</label>
        <input type="text" [(ngModel)]="categoryName" placeholder="Enter category name" />
      </div>
      <div class="actions">
        <button (click)="closeModal()">Cancel</button>
        <button (click)="saveCategory()" [disabled]="!categoryName.trim()">Save</button>
      </div>
    </div>
  </div>
</div>
