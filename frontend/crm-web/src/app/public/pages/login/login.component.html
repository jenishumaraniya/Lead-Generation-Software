<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="brand-badge">⚡ LeadGen Enterprise</div>
      <h2>Welcome Back</h2>
      <p class="subtitle">Select a portal or sign in with your credentials</p>
    </div>

    <!-- Quick Demo Buttons -->
    <div class="quick-demo-section">
      <span class="quick-title">Quick Demo Login:</span>
      <div class="quick-buttons">
        <button type="button" class="quick-btn admin-btn" (click)="quickFill('admin')">
          ⚡ Admin (Platform)
        </button>
        <button type="button" class="quick-btn sales-btn" (click)="quickFill('sales')">
          💼 Sales (Alex Carter)
        </button>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="admin@leadgen.com or sales@leadgen.com" />
        <small class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email required
        </small>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <small class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password required (min 6 chars)
        </small>
      </div>
      <div class="error-message" *ngIf="loginError">{{ loginError }}</div>
      <button type="submit" class="submit-btn" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Signing in...' : 'Sign In to Portal' }}
      </button>
    </form>

    <div class="login-footer">
      <a routerLink="/" class="back-link">← Back to Public Website</a>
    </div>
  </div>
</div>
