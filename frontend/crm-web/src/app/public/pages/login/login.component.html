<div class="login-container">
  <div class="login-box">
    <h2>LeadGen Pro</h2>
    <h3>Sign In</h3>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="your@email.com" />
        <small class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Valid email required
        </small>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
        <small class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password required (min 6 chars)
        </small>
      </div>
      <div class="error-message" *ngIf="loginError">{{ loginError }}</div>
      <button type="submit" [disabled]="loginForm.invalid || isLoading">
        {{ isLoading ? 'Logging in...' : 'Sign In' }}
      </button>
    </form>
  </div>
</div>
