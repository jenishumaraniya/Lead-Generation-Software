<div class="dialog-overlay" *ngIf="state.isOpen" (click)="onBackdropClick($event)">
  <div class="dialog-container" [ngClass]="'type-' + (state.options.type || 'danger')">
    <div class="dialog-glow"></div>
    
    <div class="dialog-card">
      <div class="dialog-icon-wrapper">
        <div class="icon-ring"></div>
        <div class="dialog-icon">
          <!-- Trash / Delete Icon -->
          <svg *ngIf="(state.options.iconType || 'trash') === 'trash'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
          <!-- Warning / Alert Icon -->
          <svg *ngIf="state.options.iconType === 'alert'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <!-- Check / Info Icon -->
          <svg *ngIf="state.options.iconType === 'check' || state.options.iconType === 'info'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <!-- Logout Icon -->
          <svg *ngIf="state.options.iconType === 'logout'" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </div>
      </div>

      <div class="dialog-content">
        <h3 class="dialog-title">{{ state.options.title }}</h3>
        <p class="dialog-message">{{ state.options.message }}</p>
        <div class="dialog-note" *ngIf="state.options.detailNote">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span>{{ state.options.detailNote }}</span>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">
          {{ state.options.cancelText || 'Cancel' }}
        </button>
        <button type="button" class="btn-confirm" (click)="onConfirm()">
          {{ state.options.confirmText || 'Confirm' }}
        </button>
      </div>
    </div>
  </div>
</div>
